<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>GRAB IT — YouTube Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    main {
      width: min(720px, 92%);
      margin: auto;
      padding: 60px 0 40px;
      flex: 1;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      letter-spacing: 2px;
      margin: 0 0 10px;
    }

    .sub {
      text-align: center;
      color: #aaa;
      margin: 0 0 32px;
    }

    .box {
      background: #1b1b1b;
      border: 1px solid #2d2d2d;
      border-radius: 18px;
      padding: 22px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    input,
    select {
      background: #292929;
      color: #fff;
      margin-bottom: 12px;
    }

    input {
      outline: none;
    }

    button {
      background: #fff;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #msg {
      min-height: 24px;
      margin-top: 14px;
      text-align: center;
      color: #bbb;
      line-height: 1.5;
    }

    #preview {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    #thumb {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 12px;
    }

    #download {
      display: none;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 24px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main>

    <h1>GRAB IT</h1>

    <p class="sub">
      Simple YouTube video downloader
    </p>

    <section class="box">

      <input
        id="url"
        type="url"
        placeholder="Paste YouTube URL here"
      >

      <select id="quality">
        <option>Best available</option>
        <option>720p</option>
        <option>480p</option>
        <option>360p</option>
      </select>

      <button id="get">
        GET VIDEO
      </button>

      <div id="preview">

        <img
          id="thumb"
          alt="Video thumbnail"
        >

        <button id="download">
          DOWNLOAD
        </button>

      </div>

      <div id="msg"></div>

    </section>

  </main>

  <footer>
    © 2026 Meheraz
  </footer>


  <script>

    const $ = (id) =>
      document.getElementById(id);


    function youtubeId(value) {

      try {

        const u = new URL(value);

        const host =
          u.hostname
            .toLowerCase()
            .replace(/^www\./, "");


        if (host === "youtu.be") {

          return (
            u.pathname
              .slice(1)
              .split("/")[0] || null
          );

        }


        if (
          (host === "youtube.com" ||
           host.endsWith(".youtube.com")) &&
          u.searchParams.get("v")
        ) {

          return u.searchParams.get("v");

        }

      } catch {}

      return null;
    }


    function showPreview() {

      const value =
        $("url").value.trim();

      const id =
        youtubeId(value);


      $("msg").textContent = "";

      $("preview").style.display =
        "none";

      $("download").style.display =
        "none";


      if (!value) {

        $("msg").textContent =
          "Paste a YouTube URL first.";

        return;
      }


      if (!id) {

        $("msg").textContent =
          "Please enter a valid YouTube URL.";

        return;
      }


      $("thumb").src =
        `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;


      $("msg").textContent =
        "Video link detected ✓";


      $("preview").style.display =
        "block";


      $("download").style.display =
        "block";
    }


    $("get").onclick =
      showPreview;


    $("url").addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {
          showPreview();
        }

      }
    );


    /*
      Start the download job.
    */
    $("download").onclick = async () => {

      const value =
        $("url").value.trim();

      const quality =
        $("quality").value;


      if (!youtubeId(value)) {

        $("msg").textContent =
          "Please enter a valid YouTube URL.";

        return;
      }


      $("download").disabled =
        true;

      $("get").disabled =
        true;

      $("download").textContent =
        "PREPARING…";

      $("msg").textContent =
        "Preparing your download…";


      try {

        /*
          Start backend job.
        */
        const response =
          await fetch(
            `/api/download?url=${encodeURIComponent(value)}&quality=${encodeURIComponent(quality)}`
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {

          throw new Error(
            data.error ||
            "Unable to start download."
          );
        }


        const jobId =
          data.jobId;


        if (!jobId) {

          throw new Error(
            "Server did not return a download job."
          );
        }


        /*
          Poll the job status.
        */
        await waitForDownload(jobId);


      } catch (error) {

        console.error(error);

        $("msg").textContent =
          error.message ||
          "Download failed.";

        $("download").disabled =
          false;

        $("get").disabled =
          false;

        $("download").textContent =
          "DOWNLOAD";
      }

    };


    /*
      Wait until the backend has a
      ready download URL.
    */
    async function waitForDownload(jobId) {

      let attempts = 0;

      const maxAttempts = 120;


      while (attempts < maxAttempts) {

        attempts++;


        await sleep(3000);


        const response =
          await fetch(
            `/api/status/${encodeURIComponent(jobId)}`
          );


        let data = null;

        try {
          data = await response.json();
        } catch {
          data = null;
        }


        if (
          !response.ok ||
          !data
        ) {

          throw new Error(
            data?.error ||
            "Unable to check download status."
          );
        }


        /*
          Still processing.
        */
        if (
          data.status ===
          "processing"
        ) {

          $("download").textContent =
            "PROCESSING…";

          $("msg").textContent =
            "Yoinku is preparing your video…";

          continue;
        }


        /*
          Download is ready.
        */
        if (
          data.status ===
          "ready" &&
          data.url
        ) {

          $("download").textContent =
            "READY ✓";

          $("msg").textContent =
            "Download ready — starting…";


          /*
            Navigate directly to Yoinku's
            short-lived download URL.
          */
          window.location.href =
            data.url;


          /*
            Give the browser a moment to
            start the download.
          */
          setTimeout(() => {

            $("download").disabled =
              false;

            $("get").disabled =
              false;

            $("download").textContent =
              "DOWNLOAD";

          }, 5000);


          return;
        }


        /*
          Backend reported an error.
        */
        if (
          data.status ===
          "error"
        ) {

          throw new Error(
            data.error ||
            "Yoinku could not prepare the video."
          );
        }


        throw new Error(
          "Unknown download status."
        );
      }


      /*
        Maximum waiting time:
        120 × 3 seconds = 6 minutes.
      */
      throw new Error(
        "The download is taking too long. Please try again."
      );
    }


    function sleep(ms) {

      return new Promise(
        resolve =>
          setTimeout(resolve, ms)
      );

    }

  </script>

</body>
</html>
